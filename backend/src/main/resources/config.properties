# Defaults for everyone. For settings that only apply to your machine, create
# backend/config.local.properties (git-ignored) with just the keys you want to change.
# Environment variables (DNSFILTER_<KEY>) and -Dkey=value flags override both.

# ---- DNS server ----
# Port 53 needs admin rights on Windows. Use 5300 while developing and test with:
#   powershell -ExecutionPolicy Bypass -File scripts\raw-query.ps1 example.com
dns.port=5300
# "::" = IPv6 + IPv4 on one socket; falls back to IPv4 only where IPv6 is switched off
dns.bind=::
# Worker threads and how many packets may wait for one; beyond that, packets are dropped
dns.workers=16
dns.queueSize=1000
# Per-client-IP token bucket: sustained queries/sec and burst size. 0 disables.
# Localhost (nslookup, benchmarks) is exempt by default.
dns.rateLimit.qps=50
dns.rateLimit.burst=100
dns.rateLimit.exemptLoopback=true
# How many client IPs the limiter remembers (least recently seen are forgotten first). Keeps memory
# and per-packet work constant during a flood from random spoofed addresses.
dns.rateLimit.maxClients=10000
# Total queries/sec across ALL clients (localhost exempt). The cap that still holds when every
# packet comes from a different address. 0 disables.
dns.rateLimit.globalQps=2000
dns.rateLimit.globalBurst=4000
# Largest UDP reply, even if a client's EDNS asks for more. Bigger answers go TC=1 -> TCP.
# 1232 avoids IP fragmentation and keeps amplification of spoofed queries around 20x.
dns.maxUdpSize=1232
# NXDOMAIN for use-application-dns.net (Firefox then turns off its own DNS-over-HTTPS) and
# mask.icloud.com / mask-h2.icloud.com (Apple turns off iCloud Private Relay). Both would
# otherwise send DNS around this server and skip every block.
dns.blockBypassCanaries=true

# DNS over TCP on the same port. Clients use it after a "truncated" UDP answer (reply too big).
dns.tcp.enabled=true
dns.tcp.maxConnections=64
# One IP can't hold every connection
dns.tcp.maxConnectionsPerClient=8
# Close a connection that sends nothing for this long
dns.tcp.idleTimeoutMs=10000
# Once a query starts arriving, all of it must arrive within this (stops slow drip-feeding)
dns.tcp.messageTimeoutMs=2000
# Close a connection whose client stops reading our replies
dns.tcp.writeTimeoutMs=5000

# ---- Upstream resolver (unknown queries are forwarded here) ----
# Public resolvers work almost everywhere. On a network that blocks outside DNS (some campus
# Wi-Fi does), put that network's resolver in backend/config.local.properties instead of here:
#   upstream.host=172.17.18.2
upstream.host=1.1.1.1
upstream.port=53
# Keep below nslookup's 2 s timeout so clients actually see our SERVFAIL on failure
upstream.timeoutMs=1500
# UDP packets get lost: if no reply after this long, send the query once more (0 = never)
upstream.retransmitMs=500
# Tried in order if the primary doesn't answer (comma-separated, same port). Whichever answers is
# then tried first, so moving between networks costs one slow lookup, then it just works.
upstream.fallback=8.8.8.8,9.9.9.9
# Upstream lookups allowed at once. Beyond this, queries get SERVFAIL immediately instead of
# waiting, so a flood of never-seen names can't tie up all dns.workers; keep it below that number.
upstream.maxInFlight=12
# After switching to a fallback, try the primary first again this often (0 = never). It may be
# the only resolver that knows your network's internal names.
upstream.primaryRetrySec=60

# ---- Cache ----
# ~1 KB each. A whole machine touches thousands of names, each in up to 3 EDNS variants.
cache.maxEntries=10000
# Upper bound on how long any answer is cached, seconds
cache.maxTtl=86400
# NXDOMAIN / "no such record" answers are cached for min(SOA TTL, this); 0 disables
cache.negativeTtl=300

# ---- Blocklists (paths relative to where you run the jar) ----
blocklist.files=../blocklists/ads.txt,../blocklists/malware.txt,../blocklists/trackers.txt
allowlist.file=../blocklists/allowlist.txt

# Public lists downloaded at startup and cached in blocklist.cacheDir (git-ignored).
# Format: category|url, comma-separated. Leave empty to use only the local files above.
# StevenBlack unified hosts = ~80k ad + malware domains.
blocklist.remote=ads|https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
blocklist.cacheDir=../blocklists/downloaded
# Re-download the remote lists this often while running (0 = only at startup / on "Reload lists")
blocklist.refreshHours=24
blocklist.downloadTimeoutMs=15000
# A download over this size is aborted; one with under this % of the cached copy's domains is
# treated as broken (error page, cut-off file) and the cached copy is kept.
blocklist.maxDownloadMb=50
blocklist.minKeepPercent=50
# Blocks / unblocks / allows made from the dashboard are saved here and re-applied on every
# (re)load, so they survive restarts. Empty = keep them in memory only.
blocklist.overridesFile=../data/overrides.txt

# ---- Saved stats ----
# Dashboard totals, top lists and the recent query log are saved here and restored at startup.
# Contains client IPs and domain names. Empty = start from zero every time.
stats.file=../data/stats.json
stats.saveIntervalSec=300

# ---- Blocking behaviour ----
# nxdomain  = blocked names "don't exist" (default)
# nullroute = answer 0.0.0.0 / :: (Pi-hole style; apps fail fast instead of retrying)
blocking.mode=nxdomain
blocking.ttl=60
# Also block when an answer's CNAME alias is blocked ("CNAME cloaking": a tracker hidden behind
# a first-party name like metrics.news-site.com). Skipped for allowlisted names.
blocking.cnameInspection=true

# Print one line per query to the console
dns.logQueries=true

# ---- Dashboard REST API ----
api.port=8081
# 127.0.0.1 = only this machine can open the dashboard. Binding anywhere else needs api.token.
api.bind=127.0.0.1
# Admin token. When set, every endpoint except /api/health needs "Authorization: Bearer <token>".
# Leave empty for local dev. In production set the DNSFILTER_API_TOKEN environment variable instead
# (never commit a token).
api.token=
# true = GET endpoints (stats, query log, top clients) stay public even with a token. The query log
# is your browsing history, so only turn this on for a demo that nobody uses as their real DNS.
api.publicReads=false
# true = allow a non-loopback api.bind WITHOUT a token. Anyone who can reach the port can then
# read the query log and edit the lists. Only for a port published to loopback (see docker-compose).
api.insecure=false
# Extra host names the dashboard may be opened by when no token is set (comma-separated, e.g. mypc.lan).
# IP addresses and localhost always work; other names are refused to stop DNS-rebinding attacks.
api.allowedHosts=
# A different origin allowed to call the API from a browser (e.g. https://dash.example.com).
# Empty = same origin only, which is all the bundled dashboard needs. "*" requires api.token.
api.corsOrigin=
# Built dashboard to serve at "/" (run `npm run build` in frontend/). Ignored if missing.
api.staticDir=../frontend/dist
# Rate limit for /api/resolve (it makes the server query upstream)
api.resolve.qps=5
api.resolve.burst=20
# HTTP server limits (the JDK server has none by default): open connections, seconds a client
# may take to send its request headers, seconds to read our response, keep-alive idle time.
api.threads=8
api.maxConnections=100
api.maxHeaderSec=10
api.maxResponseSec=30
api.idleSec=30
